apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  # Increased replicas from 2 to 3 to test ArgoCD automated sync
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
