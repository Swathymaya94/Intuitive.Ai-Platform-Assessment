apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  labels:
    app: sample-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sample-api

  template:
    metadata:
      labels:
        app: sample-api

    spec:
      containers:
        - name: sample-api
          image: hashicorp/http-echo:1.0

          args:
            - "-text=Hello from Intuitive AI Platform"

          ports:
            - containerPort: 5678
