apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Swathymaya94/Intuitive.Ai-Platform-Assessment.git
    targetRevision: feat/argocd-bootstrap
    path: bootstrap/argocd/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true